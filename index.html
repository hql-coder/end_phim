<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End Credits</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NỀN SAO -->
    <div id="stars"></div>

    <!-- KHUNG CUỘN -->
    <div class="credits-wrapper">
        <div class="credits">

            <!-- TIÊU ĐỀ -->
            <div class="intro">
                <h1>CẢM ƠN ĐÃ THEO DÕI</h1>
                <p>PHÒNG CHỐNG BẠO LỰC HỌC ĐƯỜNG</p>
            </div>

            <!-- NGƯỜI THUYẾT TRÌNH -->
            <div class="credit-section">
                <h2>NGƯỜI THUYẾT TRÌNH</h2>
                <div class="person"><span>LÊ NA</span></div>
            </div>

            <!-- NGƯỜI TÌM TÀI LIỆU -->
            <div class="credit-section">
                <h2>NGƯỜI TÌM TÀI LIỆU</h2>
                <div class="person"><span>NGUYỄN VĂN A</span></div>
                <div class="person"><span>TRẦN THỊ B</span></div>
            </div>

            <!-- NGƯỜI THIẾT KẾ -->
            <div class="credit-section">
                <h2>NGƯỜI THIẾT KẾ</h2>
                <div class="person"><span>PHẠM VĂN C</span></div>
            </div>

            <!-- NGƯỜI HẬU CẦN -->
            <div class="credit-section">
                <h2>NGƯỜI HẬU CẦN</h2>
                <div class="person"><span>HOÀNG THỊ D</span></div>
            </div>

            <!-- LỜI CẢM ƠN -->
            <div class="credit-section">
                <h2>LỜI CẢM ƠN</h2>
                <div class="person"><span>CẢM ƠN THẦY CÔ VÀ CÁC BẠN ĐÃ THEO DÕI</span></div>
            </div>

            <!-- KẾT THÚC -->
            <div class="intro">
                <h1>HẾT</h1>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
